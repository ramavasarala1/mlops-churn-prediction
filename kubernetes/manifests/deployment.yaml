---
# ConfigMap for model configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: churn-model-config
data:
  MODEL_NAME: "churn_prediction_model"
  MODEL_VERSION: "${MODEL_VERSION}"
  ENVIRONMENT: "${NAMESPACE}"
  LOG_LEVEL: "INFO"
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-model
  labels:
    app: churn-model
    environment: ${NAMESPACE}
spec:
  replicas: 1  # Will be overridden per environment
  selector:
    matchLabels:
      app: churn-model
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: churn-model
        environment: ${NAMESPACE}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: churn-model
        image: ${IMAGE}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: churn-model-config
              key: MODEL_NAME
        - name: MODEL_VERSION
          valueFrom:
            configMapKeyRef:
              name: churn-model-config
              key: MODEL_VERSION
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: churn-model-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: churn-model-config
              key: LOG_LEVEL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: churn-model
  labels:
    app: churn-model
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: churn-model