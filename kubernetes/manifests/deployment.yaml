apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  namespace: default
  labels:
    app: churn-api
    version: v1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-api
  template:
    metadata:
      labels:
        app: churn-api
        version: v1.0
    spec:
      containers:
      - name: churn-api
        image: mlopsdemodevacr41ih2a.azurecr.io/churn-api:v1.0
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL_VERSION
          value: "v1.0"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: churn-api-service
  namespace: default
  labels:
    app: churn-api
spec:
  type: ClusterIP
  selector:
    app: churn-api
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: churn-api-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: churn-api-service
            port:
              number: 80
