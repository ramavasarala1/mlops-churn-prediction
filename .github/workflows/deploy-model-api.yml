name: CI/CD Pipeline for ML Model API

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/model-api/**'
      - 'kubernetes/manifests/**'
      - '.github/workflows/deploy_model_api.yaml'
  
  push:
    branches:
      - main
    paths:
      - 'src/model-api/**'
      - 'kubernetes/manifests/**'
      - '.github/workflows/deploy_model_api.yaml'

env:
  MODEL_NAME: churn_prediction_model
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}

jobs:
  # ============================================
  # CI: Runs on Pull Requests
  # ============================================
  ci_build:
    name: CI - Build and Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install MLflow
        run: |
          pip install mlflow databricks-cli
      
      - name: Get latest model version
        id: get_model
        run: |
          python << 'EOF'
          import os
          import mlflow
          from mlflow.tracking import MlflowClient
          
          # Configure Databricks connection
          databricks_host = os.environ['DATABRICKS_HOST'].replace("https://", "").replace("http://", "")
          databricks_token = os.environ['DATABRICKS_TOKEN']
          os.environ['DATABRICKS_HOST'] = databricks_host
          os.environ['DATABRICKS_TOKEN'] = databricks_token
        
          mlflow.set_tracking_uri(f"databricks://{databricks_host}")
          
          client = MlflowClient()
          model_name = os.environ['MODEL_NAME']
          
          # Get latest version (any stage)
          versions = client.search_model_versions(f"name='{model_name}'")
          if versions:
              latest = max(versions, key=lambda v: int(v.version))
              version_number = latest.version
              print(f"Latest model version: {version_number}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"version={version_number}\n")
          else:
              print("No model versions found")
              exit(1)
          EOF
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
      
      - name: Download model from MLflow
        working-directory: src/model-api
        run: |
          python ../../scripts/model_loader.py
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
          MODEL_VERSION: ${{ steps.get_model.outputs.version }}
          OUTPUT_DIR: ./models
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
      
      - name: Build and push validation image
        working-directory: src/model-api
        run: |
          IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/churn-model:${IMAGE_TAG} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/churn-model:${IMAGE_TAG}
          echo "✅ PR validation image built and pushed: ${IMAGE_TAG}"

  # ============================================
  # CD: Runs on Push to Main
  # ============================================
  cd_deploy_staging:
    name: CD - Deploy to Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
      model_version: ${{ steps.get_model.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set image tag
        id: set_tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_ENV
          echo "📦 Image tag: ${SHORT_SHA}"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install MLflow
        run: |
          pip install mlflow databricks-cli
      
      - name: Get latest model version and transition to Staging
        id: get_model
        run: |
          python << 'EOF'
          import os
          import mlflow
          from mlflow.tracking import MlflowClient
          
          # Configure Databricks connection
          databricks_host = os.environ['DATABRICKS_HOST']
          databricks_token = os.environ['DATABRICKS_TOKEN']
          mlflow.set_tracking_uri(f"databricks://{databricks_host}")
          os.environ['DATABRICKS_TOKEN'] = databricks_token
          
          client = MlflowClient()
          model_name = os.environ['MODEL_NAME']
          
          # Get latest version
          versions = client.search_model_versions(f"name='{model_name}'")
          if not versions:
              print("No model versions found")
              exit(1)
          
          latest = max(versions, key=lambda v: int(v.version))
          version_number = latest.version
          current_stage = latest.current_stage
          
          print(f"Latest model version: {version_number}")
          print(f"Current stage: {current_stage}")
          
          # Transition to Staging if not already there
          if current_stage != "Staging":
              print(f"Transitioning model version {version_number} to Staging")
              client.transition_model_version_stage(
                  name=model_name,
                  version=version_number,
                  stage="Staging",
                  archive_existing_versions=True
              )
              print("✅ Model transitioned to Staging")
          else:
              print("Model already in Staging stage")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={version_number}\n")
          EOF
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
      
      - name: Download model from MLflow
        working-directory: src/model-api
        run: |
          python ../../scripts/model_loader.py
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
          MODEL_STAGE: 'Staging'
          OUTPUT_DIR: ./models
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
      
      - name: Build and push official image
        working-directory: src/model-api
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ env.IMAGE_TAG }}
          
          # Also tag as latest
          docker tag ${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ env.IMAGE_TAG }} \
                     ${{ env.ACR_NAME }}.azurecr.io/churn-model:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/churn-model:latest
          echo "✅ Official image built and pushed: ${{ env.IMAGE_TAG }}"
      
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing
      
      - name: Deploy to staging namespace
        run: |
          export NAMESPACE="staging"
          export IMAGE="${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ env.IMAGE_TAG }}"
          export MODEL_VERSION="${{ steps.get_model.outputs.version }}"
          
          # Create namespace if not exists
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply manifests
          envsubst < kubernetes/manifests/deployment.yaml | kubectl apply -n staging -f -
          echo "📦 Deployed image: ${IMAGE}"
          echo "🤖 Model version: ${MODEL_VERSION}"
      
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/churn-model -n staging --timeout=5m
          echo "✅ Staging deployment successful"

  # ============================================
  # Production Deployment (Manual Approval)
  # ============================================
  deploy_to_production:
    name: CD - Deploy to Production
    needs: cd_deploy_staging
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install MLflow
        run: |
          pip install mlflow databricks-cli
      
      - name: Transition model to Production in Databricks
        run: |
          python << 'EOF'
          import os
          import mlflow
          from mlflow.tracking import MlflowClient
          
          # Configure Databricks connection
          databricks_host = os.environ['DATABRICKS_HOST']
          databricks_token = os.environ['DATABRICKS_TOKEN']
          mlflow.set_tracking_uri(f"databricks://{databricks_host}")
          os.environ['DATABRICKS_TOKEN'] = databricks_token
          
          client = MlflowClient()
          model_name = os.environ['MODEL_NAME']
          version_number = os.environ['MODEL_VERSION']
          
          print(f"Transitioning model version {version_number} to Production")
          client.transition_model_version_stage(
              name=model_name,
              version=version_number,
              stage="Production",
              archive_existing_versions=True
          )
          print("✅ Model transitioned to Production in Databricks")
          EOF
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
          MODEL_VERSION: ${{ needs.cd_deploy_staging.outputs.model_version }}
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing
      
      - name: Deploy to production namespace
        run: |
          export NAMESPACE="production"
          export IMAGE="${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ needs.cd_deploy_staging.outputs.image_tag }}"
          export MODEL_VERSION="${{ needs.cd_deploy_staging.outputs.model_version }}"
          
          # Create namespace if not exists
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply manifests
          envsubst < kubernetes/manifests/deployment.yaml | kubectl apply -n production -f -
          echo "📦 Deployed image: ${IMAGE}"
          echo "🤖 Model version: ${MODEL_VERSION}"
      
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/churn-model -n production --timeout=10m
          echo "✅ Production deployment successful"
      
      - name: Create deployment tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          TAG_NAME="prod-${{ needs.cd_deploy_staging.outputs.image_tag }}"
          git tag -a "${TAG_NAME}" -m "Production deployment of commit ${{ needs.cd_deploy_staging.outputs.image_tag }} (model v${{ needs.cd_deploy_staging.outputs.model_version }})"
          git push origin "${TAG_NAME}" || true
          echo "🏷️  Created tag: ${TAG_NAME}"