name: Deploy ML Model to AKS

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model name'
        required: true
        default: 'churn_prediction_model'
      model_stage:
        description: 'Model stage'
        required: true
        default: 'Staging'
        type: choice
        options:
          - Staging
          - Production
      deploy_environment:
        description: 'Deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
  
  # Scheduled check (every 6 hours)
  # schedule:
  #   - cron: '0 */6 * * *'

env:
  MODEL_NAME: churn_prediction_model
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}

jobs:
  check-model:
    name: Check for New Model
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      model_version: ${{ steps.check.outputs.model_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install mlflow databricks-cli
      
      - name: Check for new model
        id: check
        run: |
          python << 'EOF'
          import os
          from mlflow.tracking import MlflowClient
          import mlflow
          
          # Manual trigger always deploys
          if "${{ github.event_name }}" == "workflow_dispatch":
              print("Manual trigger - will deploy")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("should_deploy=true\n")
                  f.write("model_version=latest\n")
              exit(0)
          
          # For scheduled runs, check MLflow
          try:
              databricks_host = os.environ['DATABRICKS_HOST']
              databricks_token = os.environ['DATABRICKS_TOKEN']
              
              mlflow.set_tracking_uri(f"databricks://{databricks_host}")
              os.environ['DATABRICKS_TOKEN'] = databricks_token
              
              client = MlflowClient()
              model_name = "${{ env.MODEL_NAME }}"
              
              versions = client.get_latest_versions(model_name, stages=["Staging"])
              
              if versions:
                  version = versions[0].version
                  print(f"Found model version {version} in Staging")
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write("should_deploy=true\n")
                      f.write(f"model_version={version}\n")
              else:
                  print("No model in Staging")
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write("should_deploy=false\n")
          except Exception as e:
              print(f"Error: {e}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("should_deploy=false\n")
          EOF
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  build-and-push:
    name: Build and Push Docker Image
    needs: check-model
    if: needs.check-model.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install MLflow
        run: |
          pip install mlflow databricks-cli
      
      - name: Download model from MLflow
        working-directory: src/model-api
        run: |
          python ../../scripts/model_loader.py
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MODEL_NAME: ${{ github.event.inputs.model_name || env.MODEL_NAME }}
          MODEL_STAGE: ${{ github.event.inputs.model_stage || 'Staging' }}
          OUTPUT_DIR: ./models
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
      
      - name: Set image tag
        id: image
        run: |
          TAG="v${{ needs.check-model.outputs.model_version }}-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
      
      - name: Build and push Docker image
        working-directory: src/model-api
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ env.IMAGE_TAG }}
          
          # Also tag as latest
          docker tag ${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ env.IMAGE_TAG }} \
                     ${{ env.ACR_NAME }}.azurecr.io/churn-model:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/churn-model:latest

  deploy-dev:
    name: Deploy to Dev
    needs: [check-model, build-and-push]
    if: |
      needs.check-model.outputs.should_deploy == 'true' &&
      (github.event.inputs.deploy_environment == 'dev' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing
      
      - name: Deploy to dev namespace
        run: |
          # Set environment variables for substitution
          export NAMESPACE="dev"
          export IMAGE="${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ needs.build-and-push.outputs.image_tag }}"
          export MODEL_VERSION="${{ needs.check-model.outputs.model_version }}"
          
          # Create namespace if not exists
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply manifests (you'll create these in Step 5)
          envsubst < kubernetes/manifests/deployment.yaml | kubectl apply -n dev -f -
      
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/churn-model -n dev --timeout=5m

  deploy-staging:
    name: Deploy to Staging
    needs: [check-model, build-and-push, deploy-dev]
    if: |
      needs.check-model.outputs.should_deploy == 'true' &&
      (github.event.inputs.deploy_environment == 'staging' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing
      
      - name: Deploy to staging namespace
        run: |
          export NAMESPACE="staging"
          export IMAGE="${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ needs.build-and-push.outputs.image_tag }}"
          export MODEL_VERSION="${{ needs.check-model.outputs.model_version }}"
          
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          envsubst < kubernetes/manifests/deployment.yaml | kubectl apply -n staging -f -
      
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/churn-model -n staging --timeout=5m
          echo "✅ Staging deployment successful"

  deploy-production:
    name: Deploy to Production
    needs: [check-model, build-and-push, deploy-staging]
    if: |
      needs.check-model.outputs.should_deploy == 'true' &&
      github.event.inputs.deploy_environment == 'production'
    runs-on: ubuntu-latest
    environment: production  # This requires manual approval in GitHub
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing
      
      - name: Deploy to production namespace
        run: |
          export NAMESPACE="production"
          export IMAGE="${{ env.ACR_NAME }}.azurecr.io/churn-model:${{ needs.build-and-push.outputs.image_tag }}"
          export MODEL_VERSION="${{ needs.check-model.outputs.model_version }}"
          
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          envsubst < kubernetes/manifests/deployment.yaml | kubectl apply -n production -f -
      
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/churn-model -n production --timeout=10m
          echo "✅ Production deployment successful"
      
      - name: Create deployment tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "prod-${{ needs.build-and-push.outputs.image_tag }}" -m "Production deployment"
          git push origin "prod-${{ needs.build-and-push.outputs.image_tag }}" || true