name: MLOps - Build and Deploy Model API

on:
  push:
    branches: [ main ]
    paths:
      - 'src/model-api/**'
      - '.github/workflows/deploy-model-api.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

env:
  IMAGE_NAME: churn-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      working-directory: ./src/model-api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
    
    - name: Run unit tests
      working-directory: ./src/model-api
      run: |
        # For now, just validate imports
        python -c "from app import app; print('✅ App imports successfully')"
        echo "✅ Basic validation passed"
    
    - name: Lint code
      working-directory: ./src/model-api
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "✅ Linting passed"

  build-and-push:
    name: Build Docker Image and Push to ACR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Build and push Docker image
      working-directory: ./src/model-api
      run: |
        echo "🐳 Building Docker image for linux/amd64..."
        docker build \
          --platform linux/amd64 \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
          .
        
        echo "📤 Pushing image to ACR..."
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
        
        echo "✅ Image pushed successfully!"
        echo "Image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
    
    outputs:
      image-tag: ${{ env.IMAGE_TAG }}

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Get AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
          --name ${{ secrets.AKS_CLUSTER_NAME }} \
          --overwrite-existing
    
    - name: Update deployment image
      run: |
        echo "🚀 Deploying to AKS..."
        
        # Update the image in deployment
        kubectl set image deployment/churn-api \
          churn-api=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }} \
          --record
        
        echo "⏳ Waiting for rollout to complete..."
        kubectl rollout status deployment/churn-api --timeout=300s
        
        echo "✅ Deployment successful!"
    
    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        
        # Get pod status
        kubectl get pods -l app=churn-api
        
        # Get service info
        kubectl get svc churn-api-service
        
        # Get ingress info
        INGRESS_IP=$(kubectl get ingress churn-api-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "🌐 API available at: http://$INGRESS_IP"
        
        # Test health endpoint
        sleep 10  # Wait for pods to be ready
        kubectl get pods -l app=churn-api
        
        echo "✅ Deployment verified!"
    
    - name: Post deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Cluster**: ${{ secrets.AKS_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Namespace**: default" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        INGRESS_IP=$(kubectl get ingress churn-api-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || echo "pending")
        echo "### 🌐 Endpoints" >> $GITHUB_STEP_SUMMARY
        echo "- Health: http://$INGRESS_IP/health" >> $GITHUB_STEP_SUMMARY
        echo "- Predict: http://$INGRESS_IP/predict" >> $GITHUB_STEP_SUMMARY
        echo "- Docs: http://$INGRESS_IP/docs" >> $GITHUB_STEP_SUMMARY
        echo "- Metrics: http://$INGRESS_IP/metrics" >> $GITHUB_STEP_SUMMARY
